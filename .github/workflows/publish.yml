name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version and build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      released: ${{ steps.release.outputs.released || 'false' }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - run: git reset --hard "${{ github.sha }}"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install ".[test]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python scripts/check_file_size.py
      - run: python -m pytest
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install GitVersion
        uses: GitTools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: 6.8.2

      - name: Determine version
        id: gitversion
        uses: GitTools/actions/gitversion/execute@v4.7.0

      - name: Prepare versioned release
        id: release
        env:
          RELEASE_VERSION: ${{ steps.gitversion.outputs.MajorMinorPatch }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git log -1 --format=%B "$GITHUB_SHA" > release-notes.md
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PYNISSAN="$RELEASE_VERSION" python -m build
          python -m twine check dist/*
          git diff --exit-code
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          {
            echo "released=true"
            echo "tag=$tag"
            echo "version=$RELEASE_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Upload release artifacts
        if: steps.release.outputs.released == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            dist/*
            release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Upload to PyPI
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pynissan
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  github-release:
    name: Publish GitHub release
    needs: [release, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "pynissan $RELEASE_VERSION"
          --notes-file release-notes.md
